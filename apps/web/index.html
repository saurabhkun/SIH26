<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicResolve | Government of Jharkhand Enterprise Login</title>
  <link rel="stylesheet" href="css/theme.css">
  <script src="js/auth.js"></script>
</head>
<body style="display:flex; flex-direction:column; justify-content:space-between;">
  <!-- Top Bar -->
  <div style="background:var(--brand-primary); color:#ffffff; padding:0.5rem 1.5rem; font-size:0.75rem; display:flex; justify-content:space-between; align-items:center;">
    <span>GOVERNMENT OF JHARKHAND &bull; UNIFIED ENTERPRISE GATEWAY</span>
    <button onclick="CivicAuth.toggleTheme()" class="theme-toggle-btn" style="padding:0.2rem 0.6rem; font-size:0.75rem;">🌓 Toggle Theme</button>
  </div>

  <main style="max-width:480px; width:100%; margin:3rem auto; padding:1rem;">
    <div class="card" style="padding:2rem;">
      <div style="text-align:center; margin-bottom:1.5rem;">
        <h1 style="font-size:1.8rem; color:var(--brand-primary); margin-bottom:0.25rem;">CivicResolve</h1>
        <p style="font-size:0.85rem; color:var(--text-secondary);">Merged Enterprise, CSR, Research Org &amp; Super Admin Portal</p>
      </div>

      <form id="login-form" onsubmit="handleLoginSubmit(event)" style="display:flex; flex-direction:column; gap:1rem;">
        <div>
          <label style="display:block; font-size:0.8rem; font-weight:700; margin-bottom:0.3rem;">Official Email Address</label>
          <input type="email" id="email" required placeholder="name@domain.gov.in / ac.in / corporate"
                 style="width:100%; padding:0.65rem; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-primary); color:var(--text-primary); font-size:0.9rem;"
                 value="superadmin@jharkhand.gov.in">
        </div>

        <div>
          <label style="display:block; font-size:0.8rem; font-weight:700; margin-bottom:0.3rem;">Password</label>
          <input type="password" id="password" required
                 style="width:100%; padding:0.65rem; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-primary); color:var(--text-primary); font-size:0.9rem;"
                 value="SuperAdmin@1234">
        </div>

        <button type="submit" class="btn btn-primary" style="padding:0.8rem; font-size:0.95rem; margin-top:0.5rem;">
          Authorize &amp; Enter Portal &rarr;
        </button>
      </form>

      <div style="margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--border-color); font-size:0.75rem; color:var(--text-secondary); text-align:center;">
        <div style="margin-bottom:1rem;">
          <a href="intake.html" class="btn btn-primary" style="display:block; padding:0.65rem; font-size:0.85rem; text-decoration:none;">
            🎙️ ग्रामीण नागरिक? बोलकर शिकायत दर्ज करें (Citizen Voice Portal) &rarr;
          </a>
        </div>
        <p style="margin-bottom:0.5rem;"><strong>1-Click Quick Demo Switchers:</strong></p>
        <div style="display:flex; gap:0.4rem; justify-content:center; flex-wrap:wrap;">
          <button class="btn btn-secondary" style="padding:0.25rem 0.5rem; font-size:0.7rem;" onclick="setDemo('superadmin@jharkhand.gov.in')">Super Admin</button>
          <button class="btn btn-secondary" style="padding:0.25rem 0.5rem; font-size:0.7rem;" onclick="setDemo('ro.evaluator@jharkhand.gov.in')">Research Org</button>
          <button class="btn btn-secondary" style="padding:0.25rem 0.5rem; font-size:0.7rem;" onclick="setDemo('csr.head@tatasteel.com')">CSR Partner</button>
          <button class="btn btn-secondary" style="padding:0.25rem 0.5rem; font-size:0.7rem;" onclick="setDemo('director.rnd@bitmesra.ac.in')">Tech / College</button>
        </div>
      </div>
    </div>
  </main>

  <footer style="text-align:center; padding:1rem; font-size:0.75rem; color:var(--text-secondary); border-top:1px solid var(--border-color); background:var(--bg-surface);">
    CivicResolve &bull; Government of Jharkhand Single Sign-On Gateway
  </footer>

  <script>
    function setDemo(email) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = 'Gov@1234';
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      const res = CivicAuth.login(email, pass);
      if (res.success) {
        window.location.href = res.redirect;
      }
    }
  </script>
</body>
</html>
